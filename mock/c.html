<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GiveChi · Mockup C</title>
<style>
@font-face { font-family: 'League Gothic'; src: url('../fonts/league-gothic-latin.woff2') format('woff2'); font-weight: 400; font-stretch: 75% 100%; }
@font-face { font-family: 'Geist'; src: url('../fonts/geist-latin.woff2') format('woff2'); font-weight: 100 900; }
:root {
  --ink: #0B1C2C; --ink-2: #46586A; --ink-3: #66788A;
  --sky: #E8F5FC; --sky-2: #D6EEFA; --line: #D9E6EF;
  --blue: #41B6E6; --blue-deep: #0A6C98; --blue-ink: #06324A; --red: #E4002B; --caution: #B31124;
  --green: #1E6B3A; --green-bg: #E3F4E8;
  --sans: 'Geist', system-ui, sans-serif; --display: 'League Gothic', 'Arial Narrow', sans-serif;
  --shadow: 0 1px 2px rgba(11,28,44,.05), 0 16px 40px -12px rgba(11,28,44,.16);
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: var(--sans); color: var(--ink); font-size: 17px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  background: radial-gradient(1200px 600px at 50% -10%, #fff 0%, transparent 60%), var(--sky); }
.top { max-width: 1100px; margin: 0 auto; padding: 24px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-word { font-family: var(--display); font-size: 32px; line-height: 1; }
.stars { display: flex; gap: 4px; } .stars svg { width: 12px; height: 12px; fill: var(--red); }
.skip { font-size: 15px; font-weight: 600; color: var(--ink-2); text-decoration: none; border-bottom: 1.5px solid var(--line); }
.stage { max-width: 880px; margin: 0 auto; padding: 24px 24px 64px; }
.progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 36px; }
.progress i { height: 6px; border-radius: 3px; background: #fff; box-shadow: inset 0 0 0 1px var(--line); }
.progress i.on { background: var(--blue); box-shadow: none; }
.kick { font-size: 15px; font-weight: 600; color: var(--blue-deep); margin: 0 0 8px; }
.q { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 7vw, 84px); line-height: .95; letter-spacing: .005em; margin: 0 0 32px; max-width: 16ch; text-wrap: balance; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; padding: 20px; min-height: 148px; border-radius: 20px; border: 0; background: #fff; box-shadow: 0 1px 2px rgba(11,28,44,.05); text-align: left; cursor: pointer; font: inherit; color: inherit; transition: transform .18s, box-shadow .18s, background .18s; }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow); }
.tile svg { width: 32px; height: 32px; stroke: var(--blue-deep); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile b { font-size: 17px; font-weight: 650; line-height: 1.25; }
.tile small { display: block; color: var(--ink-3); font-size: 14px; margin-top: 2px; }
.tile[aria-pressed="true"] { background: var(--ink); color: #fff; } .tile[aria-pressed="true"] svg { stroke: var(--blue); } .tile[aria-pressed="true"] small { color: #B9CAD8; }
.tiles.p { grid-template-columns: repeat(3, 1fr); }
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
.back { font: 600 15px var(--sans); color: var(--ink-2); background: none; border: 0; cursor: pointer; }
.next { height: 56px; padding: 0 28px; border-radius: 999px; border: 0; background: var(--ink); color: #fff; font: 650 16px/1 var(--sans); cursor: pointer; }

/* results */
.rh { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
.rh .q { margin: 0; }
.answers { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 28px; }
.answers span { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 999px; background: #fff; font-size: 14px; font-weight: 600; }
.answers span::after { content: "Change"; color: var(--blue-deep); font-weight: 600; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.card { background: #fff; border-radius: 24px; box-shadow: var(--shadow); padding: 26px; display: flex; flex-direction: column; }
.card:first-child { outline: 2px solid var(--blue); }
.badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; background: var(--sky); color: var(--blue-deep); font-size: 13px; font-weight: 700; }
.badge svg { width: 12px; height: 12px; fill: var(--red); }
.card h3 { font-size: 23px; line-height: 1.2; letter-spacing: -.02em; font-weight: 700; margin: 16px 0 6px; }
.card p { margin: 0; color: var(--ink-2); font-size: 15.5px; }
.why { margin-top: 16px !important; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink) !important; font-weight: 550; }
.nums { display: flex; gap: 22px; margin: 18px 0 0; }
.nums b { display: block; font-family: var(--display); font-weight: 400; font-size: 38px; line-height: 1; }
.nums span { font-size: 13.5px; color: var(--ink-3); }
.ev { font-size: 13px; font-weight: 650; color: var(--ink-2); margin-top: 14px; }
.ev.t3 { color: var(--green); }
.caution { font-size: 14px; font-weight: 650; color: var(--caution); margin-top: 10px; }
.card .go { margin-top: auto; padding-top: 22px; display: flex; gap: 8px; }
.btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; font: 650 15px/1 var(--sans); text-decoration: none; border: 1px solid var(--line); background: #fff; color: var(--ink); }
.btn-p { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.also { margin-top: 28px; text-align: center; font-size: 15px; color: var(--ink-2); }
.also a { color: var(--blue-deep); font-weight: 650; }

@media (max-width: 860px) {
  .tiles, .tiles.p { grid-template-columns: 1fr 1fr; }
  .tile { min-height: 124px; padding: 16px; }
  .cards { grid-template-columns: 1fr; }
  .rh { flex-direction: column; align-items: flex-start; }
  .q { margin-bottom: 24px; }
}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="brand-word">GiveChi</span><span class="stars" id="stars"></span></div><a class="skip" href="#">Skip to all 39 charities</a></header>
<main class="stage" id="stage"></main>
<script type="module">
import { load, PRIORITIES, match, reason, money, CAUTION, STAR, stars } from './shared.js';
const d = await load();
document.getElementById('stars').innerHTML = stars();
const ICON = {
  food: '<path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/>',
  education: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20"/>',
  housing: '<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  legal: '<path d="M12 3v18M5 21h14M4 7h16"/><path d="M6 7l-3 7a3 3 0 0 0 6 0zM18 7l-3 7a3 3 0 0 0 6 0z"/>',
  youth: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  health: '<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/><path d="M9.5 11h5M12 8.5v5"/>',
  women: '<circle cx="12" cy="7" r="3.5"/><path d="M5 21a7 7 0 0 1 14 0"/>',
  environment: '<path d="M5 19C5 10 11 5 20 4c-1 9-6 15-15 15z"/><path d="M5 19l8-8"/>',
  any: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  proven: '<path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7.5 15h9"/>',
  dollar: '<circle cx="12" cy="12" r="9"/><path d="M15 9.5c0-1.4-1.3-2.5-3-2.5s-3 1-3 2.3c0 3.2 6 1.8 6 5 0 1.4-1.3 2.7-3 2.7s-3-1-3-2.5M12 5.5v13"/>',
  steady: '<path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/>',
  local: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  reach: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="10"/>',
};
const icon = (k) => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;
const params = new URLSearchParams(location.search);
const state = { step: params.get('step') || '1', cause: params.get('cause') || '', priority: params.get('p') || '' };
const stage = document.getElementById('stage');
const prog = (n) => `<div class="progress">${[1, 2, 3].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</div>`;
function step1() {
  const tiles = [...d.causes.map(c => ({ id: c.id, label: c.short, n: d.orgs.filter(o => o.causes.includes(c.id)).length }))];
  stage.innerHTML = prog(1) + `<p class="kick">Question 1 of 3</p><h1 class="q">What do you want your gift to help with?</h1>
    <div class="tiles">${tiles.map(t => `<button class="tile" data-c="${t.id}" aria-pressed="${state.cause === t.id}">${icon(t.id)}<span><b>${t.label}</b><small>${t.n} charities</small></span></button>`).join('')}</div>
    <div class="foot"><button class="back">Not sure? Show me any cause</button><button class="next">Next</button></div>`;
  stage.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { state.cause = b.dataset.c; state.step = '2'; go(); });
}
function step2() {
  stage.innerHTML = prog(2) + `<p class="kick">Question 2 of 3</p><h1 class="q">What matters most to you?</h1>
    <div class="tiles p">${PRIORITIES.map(p => `<button class="tile" data-p="${p.id}" aria-pressed="${state.priority === p.id}">${icon(p.id)}<span><b>${p.label}</b><small>${p.hint}</small></span></button>`).join('')}
    <button class="tile" data-p="proven">${icon('any')}<span><b>Surprise me</b><small>We’ll lead with the strongest evidence</small></span></button></div>
    <div class="foot"><button class="back">← Back</button><button class="next">Next</button></div>`;
  stage.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { state.priority = b.dataset.p; state.step = 'results'; go(); });
  stage.querySelector('.back').onclick = () => { state.step = '1'; go(); };
}
function results() {
  const q = { cause: state.cause || null, priority: state.priority || 'proven' };
  const all = match(d.orgs, q); const top = all.slice(0, 3);
  const cause = d.causes.find(c => c.id === q.cause); const p = PRIORITIES.find(x => x.id === q.priority);
  stage.innerHTML = prog(3) + `<div class="rh"><h1 class="q">Here are three that fit.</h1></div>
    <div class="answers"><span>${cause ? cause.short : 'Any cause'}</span><span>${p.label}</span><span>Anywhere in Chicago</span></div>
    <div class="cards">${top.map((o, i) => { const t = d.tiers[o.ev]; const c = o.flags.filter(f => CAUTION.has(f)).length;
      return `<article class="card">${i === 0 ? `<span class="badge">${STAR} Best fit</span>` : `<span class="badge" style="background:#F1F5F8;color:var(--ink-2)">No. ${i + 1}</span>`}
        <h3>${o.name}</h3><p>${o.short}</p>
        <p class="why">${reason(o, q.priority, d.tiers)}</p>
        <div class="nums"><div><b>${o.ratio == null ? '—' : o.ratio.toFixed(1) + '%'}</b><span>to programs</span></div><div><b>${money(o.exp) || '—'}</b><span>a year</span></div></div>
        <span class="ev t${t.rank}">${t.label} evidence</span>
        ${c ? `<span class="caution">● ${c} caution${c > 1 ? 's' : ''} to read first</span>` : ''}
        <div class="go"><a class="btn btn-p" href="${o.donate}">Donate ↗</a><a class="btn" href="#">Details</a></div></article>`; }).join('')}</div>
    <p class="also">${all.length > 3 ? `${all.length - 3} more fit your answers. <a href="#">See them all</a>` : ''}</p>`;
}
function go() { ({ '1': step1, '2': step2, results })[state.step](); window.scrollTo(0, 0); }
go();
</script>
</body>
</html>
